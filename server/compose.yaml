services:
  dispatcher:
    build: .
    restart: unless-stopped
    env_file:
      - /etc/cameo-agent-dispatcher/dispatcher.env
    volumes:
      - /var/lib/cameo-agent-dispatcher:/data
    ports:
      - "127.0.0.1:8765:8765"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 0.50
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
